services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ashesi_lost_found
      MYSQL_USER: campusclaim
      MYSQL_PASSWORD: campusclaim-local-password
      MYSQL_ROOT_PASSWORD: campusclaim-local-root-password
    volumes:
      - campusclaim_mysql:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/001-database.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pcampusclaim-local-root-password"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env.local
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./assets/uploads:/var/www/html/assets/uploads

  worker:
    build: .
    restart: unless-stopped
    env_file:
      - .env.local
    depends_on:
      db:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - while true; do php bin/index-worker.php 50; sleep 3; done

volumes:
  campusclaim_mysql:
